appId: app.victoria.editor
productName: Victoria
copyright: Victoria
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
icon: build/icon.png
extraResources:
  # The window icon (Linux taskbar, development) is read from here at run time.
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
fileAssociations:
  - ext: vict
    name: Documento de Victoria
    description: Documento de Victoria
    mimeType: application/x-victoria
    role: Editor
    icon: build/icon.ico
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Graphics
  executableName: victoria
  maintainer: Victoria <victoria@example.invalid>
  synopsis: Editor vectorial de escritorio
  mimeTypes:
    - application/x-victoria
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
