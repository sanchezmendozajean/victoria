<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<script src="icons.js"></script>
</helmet>
<div data-theme="dark" style="min-height:100vh;background:var(--bg-app);color:var(--text);font-family:var(--font-ui);padding:40px clamp(16px,4vw,48px)">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px">
    <header style="display:flex;align-items:center;gap:12px">
      <svg width="32" height="32" viewBox="0 0 16 16" fill="none" style="color:var(--accent)"><path d="M2.5 2.5 8 12.5 13.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8 12.5h5.5" stroke="currentColor" stroke-width=".7"></path><circle cx="13.75" cy="12.5" r="1.2" fill="currentColor"></circle><rect x="6.4" y="10.9" width="3.2" height="3.2" fill="currentColor"></rect></svg>
      <div style="display:flex;flex-direction:column"><span style="font-size:20px;font-weight:600">Victoria · Maqueta de interfaz</span><span style="font-size:12px;color:var(--text-muted)">Referencia visual oficial (specs/10). Pantallas a 1440×900.</span></div>
    </header>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="20">
        <a href="{{ it.href }}" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:6px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);text-decoration:none" style-hover="border-color:var(--accent)">
          <span style="width:28px;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums">{{ it.n }}</span>
          <v-icon i="{{ it.icon }}" s="16" style="color:var(--icon)"></v-icon>
          <span style="flex:1;font-size:12px">{{ it.title }}</span>
          <v-icon i="chevron-right" s="12" style="color:var(--text-muted)"></v-icon>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const L = [
  ['01', 'Pantalla de inicio', 'screens/01-inicio.dc.html', 'recent'],
  ['02', 'Nuevo documento', 'screens/02-nuevo-documento.dc.html', 'new'],
  ['03', 'Pluma dibujando un ícono', 'screens/03-pluma.dc.html', 'tool-pen'],
  ['04', 'Selección + Apariencia', 'screens/04-seleccion-apariencia.dc.html', 'appearance'],
  ['05', 'Texto en trazado + fuentes', 'screens/05-texto.dc.html', 'tool-type-on-path'],
  ['06', 'Creador de formas', 'screens/06-creador-de-formas.dc.html', 'tool-shape-builder'],
  ['07', 'Espacios', 'screens/07-espacios.dc.html', 'spaces'],
  ['08', 'Mesas de trabajo', 'screens/08-mesas-de-trabajo.dc.html', 'tool-artboard'],
  ['09', 'Acomodar para imprimir', 'screens/09-acomodar-para-imprimir.dc.html', 'space-grid'],
  ['10', 'Calco de imagen', 'screens/10-calco-de-imagen.dc.html', 'trace-image'],
  ['11', 'Diálogo Zigzag', 'screens/11-dialogo-zigzag.dc.html', 'zigzag'],
  ['12', 'Imprimir', 'screens/12-dialogo-imprimir.dc.html', 'print'],
  ['13', 'Exportar para pantallas', 'screens/13-exportar-para-pantallas.dc.html', 'export-screens'],
  ['14', 'Menú Modificador', 'screens/14-menu-modificador.dc.html', 'fx'],
  ['15a', 'Pluma · tema claro', 'screens/15a-pluma-claro.dc.html', 'theme'],
  ['15b', 'Texto · tema claro', 'screens/15b-texto-claro.dc.html', 'theme'],
  ['15c', 'Pluma · Linux', 'screens/15c-pluma-linux.dc.html', 'minimize'],
  ['15d', 'Pluma · Linux, barra del sistema', 'screens/15d-pluma-linux-barra-sistema.dc.html', 'minimize'],
  ['16', 'Hoja de componentes', 'components.dc.html', 'properties'],
  ['17', 'Hoja de íconos', 'icons.dc.html', 'shapes'],
];
class Component extends DCLogic {
  renderVals() { return { items: L.map(([n, title, href, icon]) => ({ n, title, href, icon })) }; }
}
</script>
</body>
</html>
