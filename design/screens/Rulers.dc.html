<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-vc="rulers" style="position:absolute;inset:0;pointer-events:none;font-family:var(--font-ui);z-index:4">
  <div style="position:absolute;left:18px;right:0;top:0;height:18px;background:var(--bg-panel);border-bottom:1px solid var(--border);overflow:hidden">
    <sc-for list="{{ hx }}" as="t">
      <span style="position:absolute;left:{{ t.p }}px;bottom:0;width:1px;height:{{ t.h }}px;background:var(--text-muted);opacity:.7"></span>
      <sc-if value="{{ t.l }}"><span style="position:absolute;left:{{ t.lp }}px;top:1px;font-size:9px;color:var(--text-muted);font-variant-numeric:tabular-nums">{{ t.l }}</span></sc-if>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;top:18px;bottom:0;width:18px;background:var(--bg-panel);border-right:1px solid var(--border);overflow:hidden">
    <sc-for list="{{ hy }}" as="t">
      <span style="position:absolute;top:{{ t.p }}px;right:0;height:1px;width:{{ t.h }}px;background:var(--text-muted);opacity:.7"></span>
      <sc-if value="{{ t.l }}"><span style="position:absolute;top:{{ t.lp }}px;left:2px;font-size:9px;line-height:9px;color:var(--text-muted);writing-mode:vertical-rl;transform:rotate(180deg);font-variant-numeric:tabular-nums">{{ t.l }}</span></sc-if>
    </sc-for>
  </div>
  <div title="Origen de las reglas" style="position:absolute;left:0;top:0;width:18px;height:18px;background:var(--bg-panel);border-right:1px solid var(--border);border-bottom:1px solid var(--border)"><span style="position:absolute;left:4px;top:8px;width:9px;height:1px;background:var(--text-muted)"></span><span style="position:absolute;left:8px;top:4px;width:1px;height:9px;background:var(--text-muted)"></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1076,&quot;height&quot;:750},&quot;ox&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;tsType&quot;:&quot;number&quot;},&quot;oy&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;tsType&quot;:&quot;number&quot;},&quot;ppu&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;every&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;tsType&quot;:&quot;number&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1058,&quot;tsType&quot;:&quot;number&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:732,&quot;tsType&quot;:&quot;number&quot;}}">
function ticks(len, origin, ppu, every) {
  const major = every * ppu, minor = major / 8, out = [];
  const start = origin - Math.ceil(origin / minor) * minor;
  for (let p = start, i = Math.round((start - origin) / minor); p < len; p += minor, i++) {
    if (p < 0) continue;
    const m = ((i % 8) + 8) % 8;
    const isMajor = m === 0;
    out.push({ p: Math.round(p), h: isMajor ? 18 : m === 4 ? 8 : 4, l: isMajor ? String(Math.round(i / 8 * every)) : '', lp: Math.round(p) + 3 });
  }
  return out;
}
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const w = +(p.w ?? 1058), h = +(p.h ?? 732), ppu = +(p.ppu ?? 1), every = +(p.every ?? 100);
    return { hx: ticks(w, +(p.ox ?? 100), ppu, every), hy: ticks(h, +(p.oy ?? 100), ppu, every) };
  }
}
</script>
</body>
</html>
