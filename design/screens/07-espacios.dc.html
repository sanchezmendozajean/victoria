<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<script src="../icons.js"></script>
</helmet>
<div data-theme="dark" data-screen-label="07 Espacios" style="width:1440px;height:900px;display:flex;flex-direction:column;background:var(--bg-app);color:var(--text);font-family:var(--font-ui);overflow:hidden;position:relative">
  <dc-import name="TitleBar" os="win" workspace="Impresión" hint-size="1440px,32px"></dc-import>
  <dc-import name="ControlBar" mode="object" label="Sin selección" type-icon="tool-select" fill="#1F2124" x="—" y="—" w="—" h="—" hint-size="1440px,36px"></dc-import>
  <div style="flex:1;display:flex;min-height:0">
    <dc-import name="Toolbar" active="select" style="position:relative;z-index:11;overflow:visible" hint-size="48px,100%"></dc-import>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <dc-import name="DocBar" doc="logo" active="1" state="menu" target="2" panel-open="{{ true }}" style="position:relative;z-index:10;overflow:visible" hint-size="100%,58px"></dc-import>
      <div data-vc="canvas" style="position:relative;flex:1;background:var(--canvas);overflow:hidden">
        <dc-import name="Rulers" ox="306" oy="50" ppu="0.75" every="100" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
        <div style="position:absolute;left:18px;top:18px;right:0;bottom:0;overflow:hidden">
          <span style="position:absolute;left:306px;top:34px;font-size:11px;color:var(--text);white-space:nowrap">Hoja A4</span>
          <div style="position:absolute;left:306px;top:50px;width:446px;height:631px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.4);outline:1px solid #000000;padding:34px 30px;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:84px;gap:8px;color:#1F2124">
            <sc-for list="{{ sheet }}" as="c" hint-placeholder-count="25">
              <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px dashed #D0D3D7"><v-icon i="{{ c.icon }}" s="40"></v-icon><span style="font-size:8px;color:#5E636A;white-space:nowrap">{{ c.name }}</span></div>
            </sc-for>
          </div>
          <div style="position:absolute;left:300px;top:44px;width:458px;height:643px;border:1px solid #F0524F;pointer-events:none"></div>
        </div>
      </div>
    </div>
    <dc-import name="Panels" layout="properties,layers,spaces>spaces+;fill,swatches,gradient>swatches+;stroke,appearance>stroke;character,paragraph>character;align,spacing,transform,pathfinder>align" space-active="1" hint-size="316px,100%"></dc-import>
  </div>
  <dc-import name="StatusBar" zoom="75%" board="Hoja A4" tool="Selección" tool-icon="tool-select" x="412 pt" y="-38 pt" space="Hoja A4" space-color="#3FB97A" boards="1 mesa" hint-size="1440px,24px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const IC = ['tool-pen','star','tool-ellipse','spaces','print','save','image','search','link','check','tool-scissors','tool-hand','layers','tool-type','export','folder','recent','smart-guides','rulers','help','space-color','tool-eyedropper','tool-zoom','lock','visibility'];
class Component extends DCLogic {
  renderVals() {
    return { sheet: IC.map(icon => ({ icon, name: icon.replace('tool-', '') + '-24' })) };
  }
}
</script>
</body>
</html>
