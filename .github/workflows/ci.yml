name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: End-to-end (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:e2e
      - name: End-to-end (Linux, X11 under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/

  package:
    name: Package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Windows installer and portable
        if: runner.os == 'Windows'
        run: pnpm build:win
      - name: Build Linux AppImage, deb and rpm
        if: runner.os == 'Linux'
        run: pnpm build:linux
      - name: Smoke test of the packaged app (Windows)
        if: runner.os == 'Windows'
        env:
          VICTORIA_PACKAGED_EXE: release/win-unpacked/Victoria.exe
        run: pnpm exec playwright test tests/e2e/packaged.spec.ts
      # Not verified yet on a real Linux machine: reports without blocking the pipeline until it has been.
      - name: Smoke test of the packaged app (Linux, X11 under xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          VICTORIA_PACKAGED_EXE: release/linux-unpacked/victoria
        run: xvfb-run --auto-servernum pnpm exec playwright test tests/e2e/packaged.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: victoria-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
