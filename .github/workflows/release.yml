name: Release

# Builds the installers and publishes a GitHub Release when a version tag (v*) is pushed.
# Also runnable by hand for a tag that already exists: Actions › Release › Run workflow › tag "v0.1.0".

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The tag must match the version in package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Windows installer and portable
        if: runner.os == 'Windows'
        run: pnpm build:win
      - name: Build Linux AppImage, deb and rpm
        if: runner.os == 'Linux'
        run: pnpm build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: victoria-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only for CHANGELOG.md: the notes of this version head the release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist-release
          # The section "## <version> — ..." of CHANGELOG.md, up to the next "## " heading (without its own heading).
          awk -v v="${TAG#v}" '
            index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' source/CHANGELOG.md > changes.md
          if [ -s changes.md ]; then { echo "## Novedades"; cat changes.md; echo; } > notes.md; else : > notes.md; fi
          cat >> notes.md <<'NOTES'
          Editor vectorial de escritorio para Windows y Linux.

          **Instaladores sin firmar.** Windows mostrará el aviso de SmartScreen la primera vez (Más información › Ejecutar de todas formas). Los paquetes de Linux no se han verificado todavía en una máquina real.

          - Windows: `Victoria-Setup-<versión>.exe` (instalador) o la versión portátil.
          - Linux: AppImage, `.deb` o `.rpm`.

          Documentación: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NOTES
          gh release create "$TAG" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Victoria ${TAG#v}" \
            --notes-file notes.md \
            --generate-notes
